listen 1935;
max_connections 100;
daemon off;
srs_log_tank console;
srs_log_level warn;
http_api {
    enabled on;
    listen 1985;
    crossdomain on;
}
http_server {
    enabled on;
    listen 8080;
    dir ./objs/nginx/html;
}
vhost __defaultVhost__ {
    tcp_nodelay on;
    min_latency on;
    play { gop_cache off; queue_length 1; mw_latency 100; }
    publish { mr off; }
    http_remux { enabled on; mount /[app]/[stream].flv; }
}
